{% load static %}
<style>
    #pwa-install-fab {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 1050;
        display: none;
        align-items: center;
        gap: 8px;
        background: #1f2b7b;
        color: #fff;
        border: none;
        border-radius: 50px;
        padding: 12px 20px;
        font-size: .95rem;
        font-weight: 600;
        box-shadow: 0 6px 18px rgba(0, 0, 0, .25);
        cursor: pointer;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        transition: transform .15s ease, background .15s ease;
    }
    #pwa-install-fab:hover { background: #0d47a1; transform: translateY(-2px); }
    #pwa-install-fab svg { width: 20px; height: 20px; flex-shrink: 0; }

    #pwa-loading {
        position: fixed;
        inset: 0;
        z-index: 1070;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(31, 43, 123, .55);
        backdrop-filter: blur(2px);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #pwa-loading.show { display: flex; }
    #pwa-loading .card {
        background: #fff;
        border-radius: 16px;
        padding: 28px 34px;
        text-align: center;
        box-shadow: 0 12px 40px rgba(0, 0, 0, .3);
        max-width: 320px;
    }
    #pwa-loading .spinner {
        width: 48px;
        height: 48px;
        margin: 0 auto 14px;
        border: 5px solid #e3e6f5;
        border-top-color: #1f2b7b;
        border-radius: 50%;
        animation: pwa-rot .8s linear infinite;
    }
    #pwa-loading .check {
        width: 56px;
        height: 56px;
        margin: 0 auto 14px;
        border-radius: 50%;
        background: #28a745;
        color: #fff;
        font-size: 2rem;
        font-weight: 700;
        line-height: 56px;
        text-align: center;
        display: none;
        animation: pwa-pop .35s ease;
    }
    @keyframes pwa-pop {
        0% { transform: scale(0); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }
    #pwa-loading .titulo { font-size: 1.05rem; font-weight: 700; color: #1f2b7b; }
    #pwa-loading .detalle { font-size: .85rem; color: #666; margin-top: 4px; }
    @keyframes pwa-rot { to { transform: rotate(360deg); } }

    #pwa-tap {
        position: fixed;
        inset: 0;
        z-index: 1080;
        display: none;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1f2b7b 0%, #0d47a1 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        cursor: pointer;
    }
    #pwa-tap.show { display: flex; }
    #pwa-tap .card {
        text-align: center;
        color: #fff;
        padding: 32px;
        max-width: 320px;
        animation: pwa-pop .4s ease;
    }
    #pwa-tap img {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
        margin: 0 auto 18px;
    }
    #pwa-tap .titulo { font-size: 1.4rem; font-weight: 800; margin-bottom: 8px; }
    #pwa-tap .detalle { font-size: 1rem; opacity: .92; }
    #pwa-tap .pulsa {
        display: inline-block;
        margin-top: 22px;
        background: #fff;
        color: #1f2b7b;
        border-radius: 50px;
        padding: 14px 32px;
        font-weight: 700;
        font-size: 1.05rem;
        box-shadow: 0 6px 18px rgba(0, 0, 0, .25);
    }

    #pwa-update-banner {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 1060;
        display: none;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #212529;
        color: #fff;
        padding: 12px 16px;
        font-size: .9rem;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #pwa-update-banner .btn-update {
        background: #28a745;
        color: #fff;
        border: none;
        border-radius: 50px;
        padding: 6px 16px;
        font-weight: 600;
        cursor: pointer;
    }
    #pwa-update-banner .btn-update:hover { background: #218838; }
    #pwa-update-banner .btn-close {
        background: transparent;
        color: #ccc;
        border: none;
        font-size: 1.1rem;
        cursor: pointer;
        line-height: 1;
    }
</style>

<button id="pwa-install-fab" type="button" aria-label="Instalar aplicación">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
    </svg>
    <span>Instalar App</span>
</button>

<div id="pwa-loading" role="status" aria-live="polite">
    <div class="card">
        <div class="spinner" id="pwa-spinner"></div>
        <div class="check" id="pwa-check">&check;</div>
        <div class="titulo" id="pwa-loading-titulo">Descargando la aplicación...</div>
        <div class="detalle">Recursos Humanos</div>
    </div>
</div>

<div id="pwa-tap" role="button" aria-label="Instalar aplicación">
    <div class="card">
        <img src="/static/pwa/icon-192.png" alt="Recursos Humanos">
        <div class="titulo">Recursos Humanos</div>
        <div class="detalle">La aplicación está lista para instalarse</div>
        <div class="pulsa">TOCA PARA INSTALAR</div>
    </div>
</div>

<div id="pwa-update-banner" role="status">
    <span>Hay una nueva versión de la aplicación disponible.</span>
    <button class="btn-update" type="button" id="pwa-update-btn">Actualizar</button>
    <button class="btn-close" type="button" id="pwa-update-close" aria-label="Cerrar">&times;</button>
</div>

<script>
(function () {
    'use strict';

    var fab = document.getElementById('pwa-install-fab');
    var banner = document.getElementById('pwa-update-banner');
    var deferredPrompt = null;
    var newSW = null;
    var swSupported = 'serviceWorker' in navigator;

    var isIos = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
        (window.navigator && navigator.standalone === true);

    // En celulares el botón flotante no se muestra: ahí se descarga la app
    // desde la sección DESCARGANOS (Android APK / iPhone guía).
    var esMovil = /android|iphone|ipad|ipod/i.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    // Marca "ya descargado en el celular" para no volver a mostrarlo.
    var yaDescargado = false;
    try { yaDescargado = localStorage.getItem('rrhh_descargado') === '1'; } catch (e) { /* sin almacenamiento */ }

    // Si venimos de un "reiniciar desde cero", al volver ofrecemos instalar
    // con una sola pulsación.
    var autoInstall = false;
    try {
        autoInstall = sessionStorage.getItem('rrhh_auto_install') === '1';
        sessionStorage.removeItem('rrhh_auto_install');
    } catch (e) { /* sin almacenamiento */ }

    function showFab() { if (fab) { fab.style.display = 'flex'; } }
    function hideFab() { if (fab) { fab.style.display = 'none'; } }

    // El botón aparece en la computadora mientras la app no esté instalada,
    // pero nunca en celulares ni cuando ya se descargó o instaló.
    function decideFab() {
        if (esMovil || isStandalone || yaDescargado) { hideFab(); } else { showFab(); }
    }
    decideFab();

    function mostrarCarga(titulo) {
        var t = document.getElementById('pwa-loading-titulo');
        if (t) { t.textContent = titulo || 'Descargando la aplicación...'; }
        var el = document.getElementById('pwa-loading');
        if (el) { el.classList.add('show'); }
    }
    function cerrarCarga() {
        var el = document.getElementById('pwa-loading');
        if (el) { el.classList.remove('show'); }
    }
    function mostrarExito() {
        var sp = document.getElementById('pwa-spinner');
        var ch = document.getElementById('pwa-check');
        var t = document.getElementById('pwa-loading-titulo');
        if (sp) { sp.style.display = 'none'; }
        if (ch) { ch.style.display = 'block'; }
        if (t) { t.textContent = 'APLICACIÓN DESCARGADA, ABRIENDO APLICACIÓN'; }
        var el = document.getElementById('pwa-loading');
        if (el) { el.classList.add('show'); }
    }

    // IMPORTANTE: prompt() debe llamarse en el mismo gesto del usuario (síncrono).
    // Si se llama dentro de un .then() o setTimeout, Chrome lo ignora y no pasa nada.
    function iniciarInstalacion() {
        if (!deferredPrompt) { return; }
        var evt = deferredPrompt;
        mostrarCarga('Descargando la aplicación...');
        try {
            evt.prompt();
        } catch (e) {
            cerrarCarga();
            if (window.Swal) {
                Swal.fire({
                    title: 'No se pudo iniciar la descarga',
                    text: 'Vuelve a presionar "Instalar App".',
                    icon: 'error',
                    timer: 2500,
                    showConfirmButton: false
                });
            }
            return;
        }
        evt.userChoice.then(function (choice) {
            deferredPrompt = null;
            if (choice && choice.outcome === 'accepted') {
                // Muestra el mensaje de éxito y abre la aplicación automáticamente.
                mostrarExito();
                setTimeout(function () { window.location.href = '/'; }, 3500);
                return;
            }
            cerrarCarga();
            if (window.Swal) {
                Swal.fire({
                    title: 'Instalación cancelada',
                    text: 'Pulsa de nuevo "Instalar App" para intentarlo.',
                    icon: 'info',
                    timer: 2500,
                    showConfirmButton: false
                });
            }
            hideFab();
        });
    }

    // En móvil sin prompt disponible: se da una oportunidad a que Chrome/Edge
    // dispare beforeinstallprompt tras el toque y, si no, se reinicia desde cero.
    function prepararInstalacionMovil() {
        mostrarCarga('Preparando la instalación...');
        var espera = 0;
        var t = setInterval(function () {
            espera += 500;
            if (deferredPrompt) {
                clearInterval(t);
                iniciarInstalacion();
                return;
            }
            if (espera >= 4000) {
                clearInterval(t);
                reiniciarDesdeCero();
            }
        }, 500);
    }

    // "Arrancar desde cero": limpia Service Worker y cachés y recarga la página
    // para que el navegador vuelva a ofrecer la instalación.
    function reiniciarDesdeCero() {
        mostrarCarga('Reiniciando la aplicación...');
        try { sessionStorage.setItem('rrhh_auto_install', '1'); } catch (e) { /* sin almacenamiento */ }
        var tareas = [];
        if (swSupported) {
            tareas.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
            }).catch(function () {}));
        }
        if (window.caches) {
            tareas.push(caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }).catch(function () {}));
        }
        Promise.all(tareas).finally(function () {
            window.location.reload();
        });
    }

    function mostrarTocaInstalar() {
        var el = document.getElementById('pwa-tap');
        if (el) { el.classList.add('show'); }
    }
    function ocultarTocaInstalar() {
        var el = document.getElementById('pwa-tap');
        if (el) { el.classList.remove('show'); }
    }

    function avisoNoDisponible() {
        if (window.Swal) {
            Swal.fire({
                title: 'La instalación no está disponible aquí',
                text: 'Abre el menú del navegador (⋮ o ⋯) y elige "Instalar aplicación" o "Añadir a pantalla de inicio".',
                icon: 'info',
                confirmButtonText: 'Entendido'
            });
        } else {
            window.alert('La instalación no está disponible aquí. Abre el menú del navegador (⋮ o ⋯) y elige "Instalar aplicación" o "Añadir a pantalla de inicio".');
        }
    }

    if (swSupported) {
        window.addEventListener('load', function () {
            navigator.serviceWorker.register('/sw.js').catch(function (err) {
                console.error('Error registrando Service Worker:', err);
            });
        });

        window.addEventListener('beforeinstallprompt', function (e) {
            e.preventDefault();
            deferredPrompt = e;
            decideFab();
            if (autoInstall) {
                autoInstall = false;
                ocultarTocaInstalar();
                mostrarTocaInstalar();
            }
        });

        window.addEventListener('appinstalled', function () {
            deferredPrompt = null;
            try { localStorage.setItem('rrhh_descargado', '1'); } catch (e) { /* sin almacenamiento */ }
            ocultarTocaInstalar();
            hideFab();
        });

        // Detecta que se descargó una nueva versión del Service Worker.
        navigator.serviceWorker.ready.then(function (reg) {
            reg.addEventListener('updatefound', function () {
                newSW = reg.installing;
                if (newSW) {
                    newSW.addEventListener('statechange', function () {
                        if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                            if (banner) { banner.style.display = 'flex'; }
                        }
                    });
                }
            });
        });

        var updateBtn = document.getElementById('pwa-update-btn');
        if (updateBtn) {
            updateBtn.addEventListener('click', function () {
                if (newSW) { newSW.postMessage({ type: 'SKIP_WAITING' }); }
            });
        }

        var closeBtn = document.getElementById('pwa-update-close');
        if (closeBtn) {
            closeBtn.addEventListener('click', function () { if (banner) { banner.style.display = 'none'; } });
        }

        navigator.serviceWorker.addEventListener('controllerchange', function () {
            window.location.reload();
        });
    }

    function instruccionesInstalar() {
        if (!window.Swal) { return; }
        var html = '<div class="text-left">Para instalar la app en tu iPhone/iPad:<br><br>' +
            '1. Pulsa el botón <b>Compartir</b> (cuadro con flecha hacia arriba).<br>' +
            '2. Toca <b>Añadir a pantalla de inicio</b>.<br>' +
            '3. Pulsa <b>Añadir</b>.</div>';
        Swal.fire({
            title: 'Instalar la aplicación',
            html: html,
            icon: 'info',
            confirmButtonText: 'Entendido'
        });
    }

    if (fab) {
        fab.addEventListener('click', function () {
            if (deferredPrompt) {
                iniciarInstalacion();
            } else if (isIos) {
                instruccionesInstalar();
            } else {
                prepararInstalacionMovil();
            }
        });
    }

    var tap = document.getElementById('pwa-tap');
    if (tap) {
        tap.addEventListener('click', function () {
            ocultarTocaInstalar();
            if (deferredPrompt) {
                iniciarInstalacion();
            } else {
                avisoNoDisponible();
            }
        });
    }

    // Si tras un reinicio el navegador no vuelve a ofrecer instalar, avisamos.
    if (autoInstall && swSupported) {
        setTimeout(function () {
            if (autoInstall) {
                autoInstall = false;
                avisoNoDisponible();
            }
        }, 8000);
    }
})();
</script>
