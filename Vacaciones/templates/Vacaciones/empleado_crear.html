{% extends 'PlantillaGeneral.html' %}

{% block title %}Nuevo Empleado - Recursos Humanos{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-10">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="font-weight-bold text-primary mb-0">
                <i class="fas fa-user-plus mr-2"></i>Registrar Nuevo Empleado
            </h2>
            <a href="{% url 'Vacaciones:empleados_lista' %}" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left mr-1"></i>Volver a Empleados
            </a>
        </div>

        <div class="card shadow-lg border-0 rounded-lg">
            <div class="card-header bg-primary text-white py-3">
                <h5 class="card-title mb-0 font-weight-bold">Información del Empleado</h5>
            </div>
            <div class="card-body p-4">
                <form id="formCrearEmpleado">
                    {% csrf_token %}
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label class="font-weight-bold">Cédula *</label>
                            <input type="text" class="form-control" name="cedula" id="cedula" placeholder="Ej: 1710034065" maxlength="10" required>
                        </div>
                        <div class="form-group col-md-6">
                            <label class="font-weight-bold">Departamento *</label>
                            <select class="form-control" name="departamento_id" id="departamento_id" required>
                                <option value="">Seleccione Departamento...</option>
                                {% for dept in departamentos %}
                                    <option value="{{ dept.id }}">{{ dept.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label class="font-weight-bold">Nombres *</label>
                            <input type="text" class="form-control" name="nombres" id="nombres" placeholder="Nombres del empleado" required>
                        </div>
                        <div class="form-group col-md-6">
                            <label class="font-weight-bold">Apellidos *</label>
                            <input type="text" class="form-control" name="apellidos" id="apellidos" placeholder="Apellidos del empleado" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label class="font-weight-bold">Email *</label>
                            <input type="email" class="form-control" name="email" id="email" placeholder="correo@ejemplo.com" required>
                        </div>
                        <div class="form-group col-md-6">
                            <label class="font-weight-bold">Teléfono</label>
                            <input type="text" class="form-control" name="telefono" id="telefono" placeholder="Ej: 0991234567">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label class="font-weight-bold">Fecha de Nacimiento</label>
                            <input type="date" class="form-control" name="fecha_nacimiento" id="fecha_nacimiento">
                        </div>
                        <div class="form-group col-md-4">
                            <label class="font-weight-bold">Género</label>
                            <select class="form-control" name="genero" id="genero">
                                <option value="M">Masculino</option>
                                <option value="F">Femenino</option>
                            </select>
                        </div>
                        <div class="form-group col-md-4">
                            <label class="font-weight-bold">Estado</label>
                            <select class="form-control" name="estado" id="estado">
                                <option value="activo" selected>Activo</option>
                                <option value="inactivo">Inactivo</option>
                                <option value="vacaciones">Vacaciones</option>
                                <option value="licencia">Licencia</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label class="font-weight-bold">Cargo</label>
                            <input type="text" class="form-control" name="cargo" id="cargo" placeholder="Ej: Analista de Sistemas">
                        </div>
                        <div class="form-group col-md-4">
                            <label class="font-weight-bold">Fecha de Ingreso *</label>
                            <input type="date" class="form-control" name="fecha_ingreso" id="fecha_ingreso" required>
                        </div>
                        <div class="form-group col-md-4">
                            <label class="font-weight-bold">Salario ($)</label>
                            <input type="number" step="0.01" class="form-control" name="salario" id="salario" value="0.00" min="0">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="font-weight-bold">Dirección</label>
                        <textarea class="form-control" name="direccion" id="direccion" rows="2" placeholder="Dirección domiciliaria"></textarea>
                    </div>

                    <hr class="my-4">

                    <div class="d-flex justify-content-end">
                        <a href="{% url 'Vacaciones:empleados_lista' %}" class="btn btn-secondary mr-2">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="fas fa-save mr-1"></i>Guardar Empleado
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
$(document).ready(function() {
    // Validador de Cédula Ecuatoriana (Módulo 10)
    $.validator.addMethod("cedulaEcuatoriana", function(value, element) {
        if (this.optional(element)) return true;
        var cedula = String(value).trim();
        if (!/^\d{10}$/.test(cedula)) return false;
        
        var provincia = parseInt(cedula.substring(0, 2), 10);
        if ((provincia < 1 || provincia > 24) && provincia !== 30) return false;
        
        var tercerDigito = parseInt(cedula.charAt(2), 10);
        if (tercerDigito >= 6) return false;
        
        var coeficientes = [2, 1, 2, 1, 2, 1, 2, 1, 2];
        var suma = 0;
        for (var i = 0; i < 9; i++) {
            var valor = parseInt(cedula.charAt(i), 10) * coeficientes[i];
            if (valor >= 10) valor -= 9;
            suma += valor;
        }
        var digitoCalculado = (suma % 10 === 0) ? 0 : 10 - (suma % 10);
        var digitoReal = parseInt(cedula.charAt(9), 10);
        return digitoCalculado === digitoReal;
    }, "Ingrese un número de cédula ecuatoriana válido (10 dígitos).");

    $('#formCrearEmpleado').validate({
        rules: {
            cedula: { required: true, cedulaEcuatoriana: true },
            departamento_id: { required: true },
            nombres: { required: true, minlength: 2 },
            apellidos: { required: true, minlength: 2 },
            email: { required: true, email: true },
            telefono: { required: true, minlength: 7 },
            fecha_nacimiento: { required: true },
            genero: { required: true },
            estado: { required: true },
            cargo: { required: true, minlength: 2 },
            fecha_ingreso: { required: true },
            salario: { required: true, min: 0 },
            direccion: { required: true, minlength: 3 }
        },
        messages: {
            cedula: { required: "La cédula es obligatoria." },
            departamento_id: { required: "Seleccione un departamento." },
            nombres: { required: "Ingrese los nombres.", minlength: "Debe contener al menos 2 caracteres." },
            apellidos: { required: "Ingrese los apellidos.", minlength: "Debe contener al menos 2 caracteres." },
            email: { required: "Ingrese el correo electrónico.", email: "Ingrese una dirección de correo válida." },
            telefono: { required: "Ingrese el teléfono.", minlength: "Mínimo 7 dígitos." },
            fecha_nacimiento: { required: "Seleccione la fecha de nacimiento." },
            genero: { required: "Seleccione el género." },
            estado: { required: "Seleccione el estado." },
            cargo: { required: "Ingrese el cargo.", minlength: "Debe contener al menos 2 caracteres." },
            fecha_ingreso: { required: "Seleccione la fecha de ingreso." },
            salario: { required: "Ingrese el salario.", min: "El salario debe ser mayor o igual a 0." },
            direccion: { required: "Ingrese la dirección.", minlength: "Mínimo 3 caracteres." }
        },
        errorElement: 'span',
        errorClass: 'error invalid-feedback',
        highlight: function(element) {
            $(element).addClass('is-invalid');
        },
        unhighlight: function(element) {
            $(element).removeClass('is-invalid');
        },
        submitHandler: function(form) {
            const formData = new FormData(form);
            const data = {};
            formData.forEach((value, key) => { data[key] = value; });

            $.ajax({
                url: "{% url 'Vacaciones:empleado_crear' %}",
                type: 'POST',
                data: JSON.stringify(data),
                contentType: 'application/json',
                success: function(resp) {
                    if (resp.success) {
                        Swal.fire({
                            icon: 'success',
                            title: '¡Éxito!',
                            text: resp.message || 'Empleado creado exitosamente',
                            confirmButtonText: 'Aceptar'
                        }).then(() => {
                            window.location.href = "{% url 'Vacaciones:empleados_lista' %}";
                        });
                    } else {
                        Swal.fire('Error', resp.error || 'No se pudo crear el empleado', 'error');
                    }
                },
                error: function(xhr) {
                    let msg = 'Error en el servidor';
                    if (xhr.responseJSON && xhr.responseJSON.error) {
                        msg = xhr.responseJSON.error;
                    }
                    Swal.fire('Error', msg, 'error');
                }
            });
            return false;
        }
    });
});
</script>
{% endblock %}
